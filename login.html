<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up — ChaloChale Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ================= LOGIN / SIGNUP ================= -->
    <section class="auth-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-5">
            <div class="card auth-card">
              <div class="card-body">

                <!-- Brand -->
                <div class="text-center mb-4">
                  <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                    <svg width="44" height="44" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                      <defs>
                        <linearGradient id="logoGradAuth" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                          <stop stop-color="#b3402a"/>
                          <stop offset="1" stop-color="#6b2118"/>
                        </linearGradient>
                      </defs>
                      <rect width="48" height="48" rx="14" fill="url(#logoGradAuth)"/>
                      <circle cx="38" cy="10" r="3.5" fill="#fde68a"/>
                      <path d="M8 39 Q4 29 15 22" stroke="#ecc9bd" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 5"/>
                      <g transform="translate(11,11) rotate(-45 12 12) scale(1.05)">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="#fff"/>
                      </g>
                    </svg>
                    <span class="fs-4 fw-bold" style="color: var(--dark);">Chalo<span style="color: var(--primary);">Chale</span></span>
                  </a>
                </div>

                <!-- ============ LOGIN VIEW ============ -->
                <div id="loginView">
                  <div class="text-center mb-4">
                    <h2 class="auth-title mb-1">Welcome Back</h2>
                    <p class="auth-sub mb-0">Log in to manage your trips and bookings</p>
                  </div>

                  <form id="loginForm">
                    <div class="mb-3 position-relative">
                      <i class="fa-solid fa-envelope input-icon"></i>
                      <input type="email" class="form-control" placeholder="Email address" required>
                    </div>
                    <div class="mb-2 position-relative">
                      <i class="fa-solid fa-lock input-icon"></i>
                      <input type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small" for="rememberMe">Remember me</label>
                      </div>
                      <a href="#" class="small" style="color: var(--primary-dark); font-weight: 600;">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn auth-submit w-100 mb-3">
                      <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                    </button>
                    <p class="auth-footer-note text-center mb-0">
                      New to ChaloChale? <a href="#signup">Create an account</a>
                    </p>
                  </form>
                </div>

                <!-- ============ SIGNUP VIEW ============ -->
                <div id="signupView" style="display: none;">
                  <div class="text-center mb-4">
                    <h2 class="auth-title mb-1">Create Account</h2>
                    <p class="auth-sub mb-0">Join ChaloChale and start exploring</p>
                  </div>

                  <form id="signupForm" name="signupForm">
                    <div class="mb-3 position-relative">
                      <i class="fa-solid fa-user input-icon"></i>
                      <input type="text" name="fullName" class="form-control" placeholder="Full name" required>
                    </div>
                    <div class="mb-3 position-relative">
                      <i class="fa-solid fa-phone input-icon"></i>
                      <input type="tel" name="phone" class="form-control" placeholder="Phone number" required>
                    </div>
                    <div class="mb-3 position-relative">
                      <i class="fa-solid fa-envelope input-icon"></i>
                      <input type="email" name="email" class="form-control" placeholder="Email address" required>
                    </div>
                    <div class="mb-3 position-relative">
                      <i class="fa-solid fa-lock input-icon"></i>
                      <input type="password" name="password" class="form-control" placeholder="Password" required minlength="6">
                    </div>
                    <div class="mb-3 position-relative">
                      <i class="fa-solid fa-lock input-icon"></i>
                      <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm password" required minlength="6">
                    </div>
                    <div class="form-check mb-4">
                      <input class="form-check-input" type="checkbox" id="termsCheck" required>
                      <label class="form-check-label small" for="termsCheck">
                        I agree to the <a href="#" style="color: var(--primary-dark);">Terms & Conditions</a> and <a href="#" style="color: var(--primary-dark);">Privacy Policy</a>
                      </label>
                    </div>
                    <button type="submit" class="btn auth-submit w-100 mb-3">
                      <i class="fa-solid fa-user-plus me-2"></i>Create Account
                    </button>
                    <p class="auth-footer-note text-center mb-0">
                      Already have an account? <a href="#login">Login</a>
                    </p>
                  </form>
                </div>

              </div>
            </div>
            <p class="text-center mt-3 mb-0">
              <a href="index.html" class="text-white-50 text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to Home</a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
